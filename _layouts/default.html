<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
    (function(){
      var btn=document.getElementById('hamburger'), menu=document.getElementById('mobileMenu');
      if(!btn||!menu) return;
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        var open=menu.classList.toggle('open');
        btn.classList.toggle('open',open);
        btn.setAttribute('aria-expanded',open);
      });
      document.addEventListener('click',function(e){
        if(!menu.contains(e.target)){menu.classList.remove('open');btn.classList.remove('open');btn.setAttribute('aria-expanded','false');}
      });
    })();
  </script>
</body>
</html>
